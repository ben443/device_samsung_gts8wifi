name: Build OrangeFox Recovery - gts8wifi

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build variant
        required: true
        default: userdebug
        type: choice
        options: [user, userdebug, eng]
  push:
    branches: [fox_12.1, main]
  pull_request:
    branches: [fox_12.1, main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            openjdk-11-jdk python3 rsync bc ccache repo

      - name: Setup git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init OrangeFox source
        run: |
          mkdir -p ~/fox && cd ~/fox
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1
          repo sync -c --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_samsung_gts8wifi

      - name: Place device tree
        run: |
          mkdir -p ~/fox/device/samsung/gts8wifi
          rsync -a --delete ~/work/device_samsung_gts8wifi/ ~/fox/device/samsung/gts8wifi/ || \
          rsync -a --delete "$GITHUB_WORKSPACE/device_samsung_gts8wifi/" ~/fox/device/samsung/gts8wifi/

      - name: Build recovery image
        run: |
          cd ~/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch orangefox_gts8wifi-${{ github.event.inputs.build_type || 'userdebug' }}
          mka recoveryimage -j"$(nproc)"

      - name: Collect outputs
        run: |
          mkdir -p ~/artifacts
          cp -v ~/fox/out/target/product/gts8wifi/recovery.img ~/artifacts/
          tar -cvf ~/artifacts/recovery.img.tar -C ~/artifacts recovery.img

      - name: Upload recovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gts8wifi-recovery
          path: ~/artifacts/*
          if-no-files-found: error
